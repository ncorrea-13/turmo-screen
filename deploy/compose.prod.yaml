services:
  turmo:
    image: ghcr.io/ncorrea-13/turmo-screen:latest
    container_name: turmo
    restart: unless-stopped
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    environment:
      - HEIMDALL_HUB=${HEIMDALL_HUB}
      - HEIMDALL_TOKEN=${HEIMDALL_TOKEN}
      - TURMO_FLEET_CACHE=/data/fleet.json
    volumes:
      - turmo-data:/data
    logging:
      driver: journald

volumes:
  turmo-data:
